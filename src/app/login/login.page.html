<ion-content class="ion-text-center">
    <div class="login-container">
      <ion-card>
        <ion-card-header>
          <img src="https://s28164.pcdn.co/files/capybara-1920x1080-2024-600x400.jpg" alt="Login Logo" class="login-logo">
        </ion-card-header>
        <ion-card-content>
          <ion-item>
            <ion-label position="floating">Correo</ion-label>
            <ion-input type="email"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input type="password"></ion-input>
          </ion-item>
          <ion-button class="button" expand="full">Iniciar Sesión</ion-button>
        </ion-card-content>
      </ion-card>
    </div>
</ion-content>
